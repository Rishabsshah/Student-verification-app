<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Scholarship — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #111; --white: #fff;
            --green: #00E676; --lime: #C6F135;
            --yellow: #FFE500; --red: #FF3535;
            --border: 3px solid var(--black);
            --shadow: 4px 4px 0px var(--black);
            --shadow-lg: 6px 6px 0px var(--black);
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--white);
            color: var(--black);
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: radial-gradient(circle, #111 1px, transparent 1px);
            background-size: 24px 24px; opacity: 0.05;
            pointer-events: none; z-index: 0;
        }

        .top-stripe {
            background: var(--green); border-bottom: var(--border); padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 10;
        }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -1px; }
        .brand-tag { font-size: 12px; font-weight: 700; background: var(--black); color: var(--green); padding: 3px 10px; border-radius: 50px; }

        .main {
            position: relative; z-index: 1;
            max-width: 480px; margin: 0 auto;
            padding: 32px 20px 40px;
        }

        .hero { margin-bottom: 24px; }
        h1 {
            font-size: clamp(36px, 8vw, 52px);
            font-weight: 800; letter-spacing: -2px; line-height: 1;
            margin-bottom: 8px;
        }
        .subtitle { font-size: 15px; font-weight: 500; color: #555; }

        /* Card */
        .card {
            background: var(--white);
            border: var(--border); border-radius: 20px;
            padding: 28px; box-shadow: var(--shadow-lg);
            margin-bottom: 16px;
        }
        .card-header {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 24px; padding-bottom: 18px;
            border-bottom: 2px dashed #ddd;
        }
        .card-icon {
            width: 48px; height: 48px; flex-shrink: 0;
            background: var(--green); border: var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow); font-size: 22px;
        }
        .card-title { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
        .card-sub { font-size: 12px; color: #777; font-weight: 600; }

        /* Form */
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
        .input-wrap { position: relative; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; padding: 13px 16px; border: var(--border); border-radius: 10px;
            font-size: 15px; font-weight: 600; font-family: inherit;
            background: #F8FFF4; box-shadow: 3px 3px 0px var(--black);
            outline: none; transition: all 0.15s;
        }
        input:focus { background: var(--white); box-shadow: 3px 3px 0px var(--green); border-color: var(--green); }
        .pw-input { padding-right: 48px !important; }
        .eye-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; }

        /* Error */
        .error-banner { background: #FFE5E5; border: var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: 13px; font-weight: 700; color: var(--red); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; }

        /* Button */
        .btn-primary {
            width: 100%; padding: 15px;
            background: var(--green); color: var(--black);
            border: var(--border); border-radius: 12px;
            font-size: 15px; font-weight: 800; font-family: inherit;
            cursor: pointer; box-shadow: var(--shadow-lg);
            transition: all 0.12s; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px;
        }
        .btn-primary:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--black); }
        .btn-primary:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--black); }

        /* Footer */
        .footer-card {
            background: var(--lime); border: var(--border); border-radius: 14px;
            padding: 14px 20px; box-shadow: var(--shadow); text-align: center;
        }
        .footer-card a { color: var(--black); font-weight: 800; font-size: 14px; text-decoration: none; }
        .footer-card a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="top-stripe">
        <span class="brand">Scholar Verify</span>
        <span class="brand-tag">Student Verification</span>
    </div>

    <div class="main">
        <div class="hero">
            <h1>Welcome<br>Back.</h1>
            <p class="subtitle">Log in to your verified student account.</p>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon">🔑</div>
                <div>
                    <div class="card-title">Sign In</div>
                    <div class="card-sub">Enter your credentials below</div>
                </div>
            </div>

            {% if form.errors %}
            <div class="error-banner">❌ Invalid email or password.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_login">Email Address</label>
                    <div class="input-wrap">
                        <input type="email" name="username" id="id_login" placeholder="you@college.edu" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <div class="input-wrap">
                        <input type="password" name="password" id="id_password" class="pw-input" placeholder="••••••••" required>
                        <button type="button" class="eye-btn" onclick="togglePw()">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Login →</button>
            </form>
        </div>

        <div class="footer-card">
            <a href="{% url 'id_verification_page' %}">New student? Verify your ID to register →</a>
        </div>
    </div>
    <script>
        function togglePw() {
            const i = document.getElementById('id_password');
            i.type = i.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
