<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Scholarship — Selfie Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #111; --white: #fff;
            --green: #00E676; --lime: #C6F135;
            --yellow: #FFE500; --red: #FF3535;
            --border: 3px solid var(--black);
            --shadow: 4px 4px 0px var(--black); --shadow-lg: 6px 6px 0px var(--black);
        }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--white); color: var(--black); min-height: 100vh; }
        body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle, #111 1px, transparent 1px); background-size: 24px 24px; opacity: 0.05; pointer-events: none; z-index: 0; }

        .top-stripe { background: var(--green); border-bottom: var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 10; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -1px; }
        .step-pills { display: flex; gap: 6px; }
        .sp { width: 32px; height: 8px; border: 2px solid var(--black); border-radius: 50px; background: rgba(0,0,0,0.15); }
        .sp.active { background: var(--black); }

        .main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 14px; }

        .step-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--green); border: var(--border); border-radius: 50px; padding: 5px 14px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; box-shadow: var(--shadow); margin-bottom: 8px; }
        h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; }

        /* Instruction Banner */
        .instruction-banner {
            background: var(--lime); border: var(--border); border-radius: 50px;
            padding: 12px 20px; box-shadow: var(--shadow);
            font-size: 15px; font-weight: 800; text-align: center;
            transition: all 0.3s; min-height: 48px; display: flex; align-items: center; justify-content: center;
        }

        /* Camera Card */
        .camera-card {
            background: var(--white); border: var(--border); border-radius: 18px;
            padding: 20px; box-shadow: var(--shadow-lg);
            display: flex; flex-direction: column; align-items: center; gap: 16px;
        }

        #canvas-container {
            position: relative;
            width: min(260px, 70vw); height: min(260px, 70vw);
            border-radius: 50%; overflow: hidden;
            border: var(--border); box-shadow: var(--shadow-lg);
            background: var(--black);
        }
        #canvas-container.pulsing {
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(0,230,118,0.4), 4px 4px 0 var(--black); }
            50% { box-shadow: 0 0 0 10px rgba(0,230,118,0.2), 4px 4px 0 var(--black); }
        }
        #video_input { transform: scaleX(-1); width: 100%; height: 100%; object-fit: cover; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }

        .status-badge {
            padding: 10px 20px; border: var(--border); border-radius: 50px;
            font-size: 13px; font-weight: 800; box-shadow: var(--shadow);
            transition: all 0.3s; background: #F5F5F5; color: #888;
        }
        .status-badge.ok   { background: var(--green); color: var(--black); }
        .status-badge.err  { background: var(--red); color: var(--white); }

        /* Steps */
        .steps-card { background: var(--lime); border: var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
        .steps-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
        .steps-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .step-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--black); color: var(--lime);
            padding: 6px 14px; border-radius: 50px; border: 2px solid var(--black);
            font-size: 12px; font-weight: 800; box-shadow: 2px 2px 0 var(--black);
        }
        .step-chip.done { background: var(--white); color: var(--black); }

        @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
        .flash-effect { position: fixed; inset: 0; background: var(--white); z-index: 1000; animation: flash 0.4s ease-out forwards; pointer-events: none; }
    </style>
</head>
<body>
    <div class="top-stripe">
        <span class="brand">Scholar Verify</span>
        <div class="step-pills">
            <div class="sp active"></div>
            <div class="sp active"></div>
            <div class="sp active"></div>
        </div>
    </div>

    <div class="main">
        <div>
            <div class="step-tag">📸 Step 3 of 3</div>
            <h1>Selfie<br>Verification.</h1>
        </div>

        <div class="instruction-banner" id="instruction">Loading Camera...</div>

        <div class="camera-card">
            <div id="canvas-container">
                <video id="video_input" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
            </div>
            <div class="status-badge" id="status-text">Initializing...</div>
        </div>

        <div class="steps-card">
            <div class="steps-title">📋 Liveness Steps</div>
            <div class="steps-row">
                <div class="step-chip" id="chip-0">👁️ Center Face</div>
                <div class="step-chip" id="chip-1">⬅️ Turn Left</div>
                <div class="step-chip" id="chip-2">😑 Blink</div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video_input');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const instructionEl = document.getElementById('instruction');
        const statusEl = document.getElementById('status-text');
        const container = document.getElementById('canvas-container');

        let livenessStep = 0, captured = false, blinkDetected = false;

        const STEPS = [
            { id: 0, text: "👁️ Center your face in the circle", check: checkCenter },
            { id: 1, text: "⬅️ Now turn slightly LEFT", check: checkTurnLeft },
            { id: 2, text: "😑 Blink your eyes slowly", check: checkBlink }
        ];

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                if (!captured) processLiveness(results.multiFaceLandmarks[0]);
            } else {
                instructionEl.innerText = "❓ Face not visible";
                container.classList.remove('pulsing');
                statusEl.className = 'status-badge err'; statusEl.innerText = "No face found";
            }
            canvasCtx.restore();
        }

        function processLiveness(landmarks) {
            const s = STEPS[livenessStep];
            instructionEl.innerText = s.text;
            container.classList.add('pulsing');
            statusEl.className = 'status-badge ok';
            if (s.check(landmarks)) {
                document.getElementById('chip-'+livenessStep).classList.add('done');
                if ('vibrate' in navigator) navigator.vibrate(50);
                livenessStep++;
                if (livenessStep >= STEPS.length) captureSelfie();
                else { instructionEl.style.background='#00E676'; setTimeout(()=>instructionEl.style.background='#C6F135',500); }
            }
        }

        function checkCenter(lm) { const n=lm[1]; return n.x>0.4&&n.x<0.6&&n.y>0.4&&n.y<0.7; }
        function checkTurnLeft(lm) { return lm[1].x > 0.6; }
        function checkBlink(lm) {
            const lo = Math.abs(lm[159].y - lm[145].y), ro = Math.abs(lm[386].y - lm[374].y);
            if (lo < 0.015 && ro < 0.015) { blinkDetected = true; }
            else if (blinkDetected) { blinkDetected = false; return true; }
            return false;
        }

        function captureSelfie() {
            captured = true;
            instructionEl.innerText = "⏳ Verifying...";
            container.classList.remove('pulsing');
            statusEl.className = 'status-badge'; statusEl.innerText = "Processing...";
            const flash = document.createElement('div'); flash.className = 'flash-effect'; document.body.appendChild(flash);
            if ('vibrate' in navigator) navigator.vibrate([100,50,100]);
            canvasElement.toBlob(uploadFrame, 'image/jpeg', 0.95);
        }

        async function uploadFrame(blob) {
            const fd = new FormData();
            fd.append('selfie_image', blob, 'liveness.jpg');
            fd.append('id_card_token', "{{ token }}");
            try {
                const res = await fetch('/api/verification/verify-selfie/', { method:'POST', body:fd, headers:{'X-CSRFToken':'{{ csrf_token }}'} });
                const data = await res.json();
                if (data.success) {
                    instructionEl.innerText = "✅ Verified!";
                    statusEl.className = 'status-badge ok'; statusEl.innerText = "Redirecting...";
                    if ('vibrate' in navigator) navigator.vibrate([100,50,100,50,100]);
                    setTimeout(() => window.location.href = "{% url 'triple_lock_page' %}", 1500);
                } else {
                    instructionEl.innerText = "❌ Match Failed";
                    statusEl.className = 'status-badge err'; statusEl.innerText = data.message || "Verification failed";
                    if ('vibrate' in navigator) navigator.vibrate([200,100,200]);
                    setTimeout(() => window.location.reload(), 3000);
                }
            } catch(e) {
                instructionEl.innerText = "Connection Error";
                statusEl.className = 'status-badge err'; statusEl.innerText = "Please try again";
            }
        }

        const faceMesh = new FaceMesh({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
        faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5 });
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => await faceMesh.send({ image: videoElement }),
            width: 640, height: 480
        });
        camera.start()
            .then(() => { statusEl.className='status-badge ok'; statusEl.innerText='🟢 Camera Active!'; instructionEl.innerText='👁️ Center your face in the circle'; })
            .catch(() => { instructionEl.innerText='Camera Error'; statusEl.className='status-badge err'; statusEl.innerText='Allow camera access'; });
    </script>
</body>
</html>
