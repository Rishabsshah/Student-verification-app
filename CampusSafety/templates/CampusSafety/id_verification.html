<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Scholarship — Student Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --black: #111;
            --white: #fff;
            --green: #00E676;
            --lime: #C6F135;
            --yellow: #FFE500;
            --purple: #7B2FFF;
            --red: #FF3535;
            --bg: #fff;
            --border: 3px solid var(--black);
            --shadow: 4px 4px 0px var(--black);
            --shadow-lg: 6px 6px 0px var(--black);
        }

        html { height: 100%; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--black);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Dot grid */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: radial-gradient(circle, #111 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.05;
            pointer-events: none; z-index: 0;
        }

        /* Top stripe */
        .top-stripe {
            background: var(--green);
            border-bottom: var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: -1px; }
        .step-pills { display: flex; gap: 6px; }
        .sp {
            width: 32px; height: 8px;
            border: 2px solid var(--black);
            border-radius: 50px;
            background: rgba(0,0,0,0.15);
        }
        .sp.active { background: var(--black); }

        /* Main */
        .main {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 20px 32px;
            gap: 16px;
        }

        /* Hero */
        .hero { }
        .step-tag {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--green); border: var(--border); border-radius: 50px;
            padding: 5px 14px; font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.6px;
            box-shadow: var(--shadow);
            margin-bottom: 10px;
        }
        h1 {
            font-size: clamp(28px, 6vw, 40px);
            font-weight: 800; letter-spacing: -1.5px; line-height: 1.05;
            margin-bottom: 6px;
        }
        .subtitle { font-size: 14px; font-weight: 500; color: #555; line-height: 1.5; }

        /* Verification Card */
        .card {
            background: var(--white);
            border: var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px; padding-bottom: 14px;
            border-bottom: 2px dashed #ddd;
        }
        .card-icon {
            width: 46px; height: 46px; flex-shrink: 0;
            background: var(--green); border: var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow);
        }
        .card-icon svg { width: 24px; height: 24px; stroke: var(--black); stroke-width: 2.5; fill: none; }
        .card-title { font-size: 17px; font-weight: 800; margin-bottom: 2px; }
        .card-sub { font-size: 12px; color: #777; font-weight: 600; }

        /* Upload Zone */
        .upload-zone {
            border: 3px dashed var(--black);
            border-radius: 14px; padding: 20px 16px;
            text-align: center; background: #F9FFF4; cursor: pointer;
            transition: all 0.2s; margin-bottom: 14px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 130px; position: relative;
        }
        .upload-zone:active { transform: scale(0.98); }
        .upload-zone.drag-over { background: #E0FFE9; border-style: solid; }
        .upload-zone.has-file { border-style: solid; padding: 14px; }

        .upload-icon {
            width: 52px; height: 52px;
            background: var(--lime); border: var(--border); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow); margin: 0 auto 10px;
        }
        .upload-icon svg { width: 26px; height: 26px; stroke: var(--black); stroke-width: 2.5; fill: none; }
        .upload-text { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
        .upload-hint { font-size: 11px; color: #888; font-weight: 600; }

        #file-input { display: none; }
        .file-preview { display: none; width: 100%; }
        .file-preview.active { display: block; }
        .preview-img-wrap { border: var(--border); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 10px; }
        .preview-img-wrap img { width: 100%; max-height: 180px; object-fit: contain; display: block; }
        .file-info { background: #fff; border: 2px solid var(--black); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 2px 2px 0 var(--black); }
        .file-name { font-weight: 800; font-size: 12px; word-break: break-word; }
        .file-size { font-size: 11px; color: #888; font-weight: 600; }
        .remove-btn { background: var(--red); color: #fff; border: 2px solid var(--black); padding: 5px 10px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; margin-left: 10px; box-shadow: 2px 2px 0 var(--black); transition: all 0.1s; }
        .remove-btn:active { transform: translate(2px,2px); box-shadow: none; }

        /* Progress */
        .progress-container { display: none; margin-bottom: 12px; }
        .progress-container.active { display: block; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .progress-track { height: 16px; background: #eee; border: var(--border); border-radius: 50px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--green); width: 0%; transition: width 0.3s; }

        /* Verify Btn */
        .verify-btn {
            width: 100%; padding: 15px;
            background: var(--green); color: var(--black);
            border: var(--border); border-radius: 12px;
            font-size: 15px; font-weight: 800; font-family: inherit;
            cursor: pointer; box-shadow: var(--shadow-lg);
            transition: all 0.12s; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .verify-btn:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--black); }
        .verify-btn:active:not(:disabled) { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--black); }
        .verify-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; box-shadow: 2px 2px 0 #bbb; border-color: #bbb; }
        .btn-loader { width: 16px; height: 16px; border: 3px solid rgba(0,0,0,0.2); border-top-color: var(--black); border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        .verify-btn.loading .btn-loader { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Message */
        .msg-box { margin-top: 12px; padding: 12px 14px; border: var(--border); border-radius: 10px; font-weight: 700; font-size: 13px; display: none; align-items: center; gap: 8px; box-shadow: var(--shadow); }
        .msg-box.active { display: flex; }
        .msg-box.success { background: #D4FFEA; color: #005C2E; }
        .msg-box.error { background: #FFE5E5; color: var(--red); }

        /* Info card */
        .info-card {
            background: var(--lime); border: var(--border); border-radius: 14px;
            padding: 14px 16px; box-shadow: var(--shadow);
        }
        .info-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .info-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .info-list li { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .info-list li::before { content: '▶'; font-size: 8px; flex-shrink: 0; }
    </style>
</head>
<body>
    <!-- Top stripe nav -->
    <div class="top-stripe">
        <span class="brand">Scholar Verify</span>
        <div class="step-pills">
            <div class="sp active"></div>
            <div class="sp"></div>
        </div>
    </div>

    <div class="main">
        <!-- Hero -->
        <div class="hero">
            <div class="step-tag">📋 Step 1 of 2</div>
            <h1>Upload Your<br>Student ID.</h1>
            <p class="subtitle">We'll extract your enrollment details automatically.</p>
        </div>

        <!-- Upload Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-5 4 4 6-6"/></svg>
                </div>
                <div>
                    <div class="card-title">ID Verification</div>
                    <div class="card-sub">Tap the zone below to upload</div>
                </div>
            </div>

            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('file-input').click()">
                <div id="upload-content">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <div class="upload-text">Tap to Upload ID</div>
                    <div class="upload-hint">JPG, PNG — Max 10MB</div>
                </div>

                <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)">

                <div class="file-preview" id="file-preview">
                    <div class="preview-img-wrap">
                        <img id="preview-img" alt="ID Preview">
                    </div>
                    <div class="file-info">
                        <div>
                            <div class="file-name" id="file-name"></div>
                            <div class="file-size" id="file-size"></div>
                        </div>
                        <button class="remove-btn" onclick="removeFile(event)">✕</button>
                    </div>
                </div>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-label"><span>Verifying...</span><span id="progress-text">0%</span></div>
                <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
            </div>

            <button class="verify-btn" id="verify-btn" onclick="verifyIdCard()" disabled>
                <div class="btn-loader"></div>
                <span id="btn-text">Select ID Card First</span>
            </button>

            <div class="msg-box" id="msg-box">
                <span id="msg-text"></span>
            </div>
        </div>

        <!-- Info -->
        <div class="info-card">
            <div class="info-title">📋 Requirements</div>
            <ul class="info-list">
                <li>Clear ID photo</li>
                <li>Good lighting</li>
                <li>All text readable</li>
                <li>Flat surface</li>
            </ul>
        </div>
    </div>

    <script>
        let selectedFile = null;
        const uploadZone = document.getElementById('upload-zone');

        uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault(); uploadZone.classList.remove('drag-over');
            const f = e.dataTransfer.files[0];
            if (f && f.type.startsWith('image/')) processFile(f);
        });

        function handleFileSelect(e) { if (e.target.files[0]) processFile(e.target.files[0]); }

        function processFile(file) {
            selectedFile = file;
            uploadZone.classList.add('has-file');
            document.getElementById('upload-content').style.display = 'none';
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('file-name').textContent = file.name.length > 25 ? file.name.slice(0,22)+'...' : file.name;
                document.getElementById('file-size').textContent = formatSize(file.size);
                document.getElementById('file-preview').classList.add('active');
            };
            reader.readAsDataURL(file);
            document.getElementById('verify-btn').disabled = false;
            document.getElementById('btn-text').textContent = 'Verify ID Card →';
            if ('vibrate' in navigator) navigator.vibrate(40);
        }

        function removeFile(e) {
            e.stopPropagation(); selectedFile = null;
            uploadZone.classList.remove('has-file');
            document.getElementById('upload-content').style.display = '';
            document.getElementById('file-preview').classList.remove('active');
            document.getElementById('file-input').value = '';
            document.getElementById('verify-btn').disabled = true;
            document.getElementById('btn-text').textContent = 'Select ID Card First';
            hideMsg(); hideProgress();
        }

        function formatSize(b) {
            if (!b) return '0 B';
            const k = 1024, s = ['B','KB','MB','GB'], i = Math.floor(Math.log(b)/Math.log(k));
            return (b/Math.pow(k,i)).toFixed(1)+' '+s[i];
        }

        async function verifyIdCard() {
            if (!selectedFile) { showMsg('Please upload an ID card image.', 'error'); return; }
            const btn = document.getElementById('verify-btn');
            btn.disabled = true; btn.classList.add('loading');
            document.getElementById('btn-text').textContent = 'Verifying...';
            hideMsg(); showProgress();

            const formData = new FormData();
            formData.append('id_image', selectedFile);

            try {
                const bar = document.getElementById('progress-bar'), pt = document.getElementById('progress-text');
                let p = 0;
                const iv = setInterval(() => { p = Math.min(p+7, 85); bar.style.width=p+'%'; pt.textContent=p+'%'; }, 300);
                const res = await fetch('/api/verification/inspect-id/', { method:'POST', body:formData, headers:{'X-CSRFToken':getCookie('csrftoken')} });
                clearInterval(iv); bar.style.width='100%'; pt.textContent='100%';
                const data = await res.json();
                if (data.valid || data.id_card_token) {
                    showMsg('✓ ID Verified! Redirecting...', 'success');
                    if ('vibrate' in navigator) navigator.vibrate([80,40,80]);
                    const token = data.id_card_token || data.token || '';
                    const url = `/verification/account-details/?token=${token}&enrollment=${data.enrollment}${data.identity_hash?'&hash='+data.identity_hash:''}${data.session_token?'&session_token='+data.session_token:''}`;
                    setTimeout(() => window.location.href = url, 1200);
                } else {
                    hideProgress();
                    showMsg('❌ '+(data.message||data.error||'Verification failed.'), 'error');
                    btn.disabled=false; btn.classList.remove('loading');
                    document.getElementById('btn-text').textContent='Verify ID Card →';
                }
            } catch(err) {
                hideProgress(); showMsg('❌ Connection error. Try again.', 'error');
                btn.disabled=false; btn.classList.remove('loading');
                document.getElementById('btn-text').textContent='Verify ID Card →';
            }
        }

        function showProgress() { document.getElementById('progress-container').classList.add('active'); }
        function hideProgress() {
            document.getElementById('progress-container').classList.remove('active');
            document.getElementById('progress-bar').style.width='0%';
            document.getElementById('progress-text').textContent='0%';
        }
        function showMsg(t, type) { const b=document.getElementById('msg-box'); document.getElementById('msg-text').textContent=t; b.className='msg-box active '+type; }
        function hideMsg() { document.getElementById('msg-box').className='msg-box'; }
        function getCookie(n) { const v=document.cookie.match('(^|;) ?'+n+'=([^;]*)(;|$)'); return v?v[2]:null; }
    </script>
</body>
</html>
